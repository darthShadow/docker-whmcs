date.timezone = UTC
upload_max_filesize = 25M
post_max_size = 25M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M

; Session GC is handled by /etc/cron.d/php from the php-common package
; (runs /usr/lib/php/sessionclean every ~30 minutes). Disable PHP's
; per-request GC scan to avoid double cleanup and request-time latency.
; If you disable the cron service, re-enable this (e.g., set to 1) or
; sessions will accumulate in /var/lib/php/sessions until container restart.
session.gc_probability = 0

# OpCache Settings
opcache.enable = 1
opcache.enable_cli = 1
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 128
opcache.save_comments = 1
opcache.revalidate_freq = 1
