---
name: Docker Build

defaults:
  run:
    shell: bash

concurrency:
  group: docker-build-${{ github.sha }}
  cancel-in-progress: false

'on':
  workflow_call:
    inputs:
      whmcs_version:
        description: 'WHMCS version to build'
        required: true
        type: string
      php_version:
        description: 'PHP version to build'
        required: true
        type: string
      whmcs_sha256:
        description: 'Expected SHA256 for the WHMCS release zip'
        required: false
        type: string
        default: ''
      base_image:
        description: 'Base image tag or digest reference'
        required: false
        type: string
        default: 'lscr.io/linuxserver/baseimage-ubuntu:noble'
      push_enabled:
        description: 'Whether to push the built image'
        required: false
        type: boolean
        default: true
      extra_tags:
        description: 'Additional tags for the image'
        required: false
        type: string
        default: ''
      image_description:
        description: 'Description for the Docker image'
        required: false
        type: string
        default: 'WHMCS Docker Image'

jobs:
  build-image:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm

    name: Build Docker Image for ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Set OWNER_NAME Variable
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "OWNER_NAME=$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      - name: Set PLATFORM Variable
        env:
          MATRIX_PLATFORM: ${{ matrix.platform }}
        run: |
          platform="${MATRIX_PLATFORM}"
          echo "PLATFORM=${platform//\//-}" >> "${GITHUB_ENV}"

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,manifest-descriptor
        with:
          images: |
            ghcr.io/${{ env.OWNER_NAME }}/whmcs
          labels: |
            org.opencontainers.image.title=whmcs
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/pkgs/container/whmcs
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=semver,pattern={{raw}}
            type=sha
            type=ref,event=pr
            type=ref,event=branch
            type=raw,value=latest,enable=${{
              github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            }}
            ${{ inputs.extra_tags }}
          bake-target: image-single

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to GitHub Container Registry
        if: inputs.push_enabled && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Build Date
        id: gen_date
        run: |
          BUILD_DATE=$(date '+%Y-%m-%dT%H:%M:%S%:z')
          echo "**** Setting build date to $BUILD_DATE ****"
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build and Publish Image Digest
        id: build
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4  # v6
        with:
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
            cwd://${{ steps.meta.outputs.bake-file-annotations }}
          set: |
            image-single.args.BUILD_DATE=${{ steps.gen_date.outputs.build_date }}
            image-single.args.BASE_IMAGE=${{ inputs.base_image }}
            image-single.args.WHMCS_RELEASE=${{ inputs.whmcs_version }}
            image-single.args.PHP_RELEASE=${{ inputs.php_version }}
            image-single.args.WHMCS_SHA256=${{ inputs.whmcs_sha256 }}
            image-single.platform=${{ matrix.platform }}
            image-single.output=type=image,name=ghcr.io/${{
              env.OWNER_NAME
            }}/whmcs,push-by-digest=true,name-canonical=true,push=${{ inputs.push_enabled }}
            image-single.tags=
          targets: image-single
          provenance: false

      - name: Export Image Digest
        id: image_digest
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          mkdir -p /tmp/digests
          # Extract digest from metadata since tags are empty and digest output will be empty
          metadata="${BUILD_METADATA}"
          echo "Extracting digest from metadata (tags are intentionally empty)..."
          echo "Metadata: $metadata"
          # Parse digest from JSON metadata
          digest=$(echo "$metadata" | jq -r '."image-single"."containerimage.digest" // empty' 2>/dev/null || echo "")
          if [ -n "$digest" ] && [ "$digest" != "null" ] && [ "$digest" != "empty" ]; then
            echo "Found digest: $digest"
            touch "/tmp/digests/${digest#sha256:}"
            echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::Unable to extract image digest from metadata"
            echo "::error::This is required for the multi-arch manifest creation"
            exit 1
          fi

      - name: Smoke Test Image
        env:
          DIGEST: ${{ steps.image_digest.outputs.digest }}
          WHMCS_ADMIN_PATH: admin
        run: |
          set -euo pipefail

          config_dir=$(mktemp -d)
          container_name="smoke"
          image_ref="ghcr.io/${OWNER_NAME}/whmcs@${DIGEST}"

          cleanup() {
            docker logs "${container_name}" >/tmp/whmcs-smoke.log 2>&1 || true
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
            rm -rf "${config_dir}" || true
          }
          trap cleanup EXIT

          docker pull "${image_ref}"

          docker run -d --rm \
            --name "${container_name}" \
            -e WHMCS_ADMIN_PATH="${WHMCS_ADMIN_PATH}" \
            -e AUTH_USER=t \
            -e AUTH_PASS=t \
            -p 18080:80 \
            -v "${config_dir}:/config" \
            "${image_ref}"

          ready=false
          status=""
          for _ in {1..90}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)
            if [ "${status}" = "200" ] || [ "${status}" = "302" ]; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "${ready}" != "true" ]; then
            docker logs "${container_name}"
            echo "::error::Smoke container did not serve / within 180 seconds"
            exit 1
          fi

          root_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/)
          if [ "${root_status}" != "200" ] && [ "${root_status}" != "302" ]; then
            docker logs "${container_name}"
            echo "::error::Expected / to return 200 or 302, got ${root_status}"
            exit 1
          fi

          admin_status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080/${WHMCS_ADMIN_PATH}/")
          if [ "${admin_status}" != "401" ]; then
            docker logs "${container_name}"
            echo "::error::Expected /${WHMCS_ADMIN_PATH}/ to return 401, got ${admin_status}"
            exit 1
          fi

      - name: Upload Image Digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: digests-${{ env.PLATFORM }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge-image:
    name: Merge & Push Final Docker Image
    runs-on: ubuntu-24.04
    needs:
      - build-image

    steps:
      - name: Download Image Digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set OWNER_NAME Variable
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "OWNER_NAME=$(echo "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')" >> "${GITHUB_ENV}"

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: |
            ghcr.io/${{ env.OWNER_NAME }}/whmcs
          labels: |
            org.opencontainers.image.title=whmcs
            org.opencontainers.image.description=${{ inputs.image_description }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/pkgs/container/whmcs
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.authors=${{ github.repository_owner }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            type=semver,pattern={{raw}}
            type=sha
            type=ref,event=pr
            type=ref,event=branch
            type=raw,value=latest,enable=${{
              github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
            }}
            ${{ inputs.extra_tags }}

      - name: Extract Tags
        shell: python
        run: |
          import json, os

          metadata_json = os.environ['DOCKER_METADATA_OUTPUT_JSON']
          metadata = json.loads(metadata_json)

          tags = [f"--tag '{tag}'" for tag in metadata["tags"]]
          tags_string = " ".join(tags)

          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"TAGS={tags_string}\n")

      - name: Extract Annotations
        shell: python
        run: |
          import json, os

          metadata_json = os.environ['DOCKER_METADATA_OUTPUT_JSON']
          metadata = json.loads(metadata_json)

          annotations = [f"--annotation '{annotation}'" for annotation in metadata["annotations"]]
          annotations_string = " ".join(annotations)

          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"ANNOTATIONS={annotations_string}\n")

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Login to GitHub Container Registry
        if: inputs.push_enabled && github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & Push Manifest List
        if: inputs.push_enabled && github.event_name != 'pull_request'
        working-directory: /tmp/digests
        env:
          OWNER_NAME: ${{ env.OWNER_NAME }}
        run: |
          eval "docker buildx imagetools create \
          ${TAGS} \
          ${ANNOTATIONS} \
          $(printf "ghcr.io/${OWNER_NAME}/whmcs@sha256:%s " *)"

      - name: Inspect Multi-Platform Image
        if: inputs.push_enabled && github.event_name != 'pull_request'
        env:
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
          OWNER_NAME: ${{ env.OWNER_NAME }}
        run: |
          docker buildx imagetools inspect --raw "ghcr.io/${OWNER_NAME}/whmcs:${IMAGE_VERSION}"

      - name: Cleanup
        run: |
          rm -f ${HOME}/.docker/config.json
